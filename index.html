<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        /* Dark Glassmorphism Styles (No Glow) - Brighter */
                                        .glass-romance { background: rgba(251, 113, 133, 0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
                                        .glass-romance-pressed { background: rgba(251, 113, 133, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.4); }
        
                                        .glass-midnight { background: rgba(165, 180, 252, 0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
                                        .glass-midnight-pressed { background: rgba(165, 180, 252, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.4); }
        
                                        .glass-sunshine { background: rgba(253, 230, 138, 0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
                                        .glass-sunshine-pressed { background: rgba(253, 230, 138, 0.15); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: inset 0 4px 15px rgba(0, 0, 0, 0.4); }

        /* Slow Float Animations - More Motion */
                @keyframes float-slow {
                    0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.9; }
                    33% { transform: translate(15px, -35px) rotate(10deg) scale(1.05); opacity: 0.6; }
                    66% { transform: translate(-15px, -15px) rotate(-10deg) scale(0.95); opacity: 0.8; }
                    100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0.9; }
                }
                .animate-float-slow { animation: float-slow 8s ease-in-out infinite alternate; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
                * { outline: none; }
    </style>
</head>
<body class="min-h-screen transition-all duration-1000 ease-in-out antialiased relative z-0" 
      :class="themeStyles[activeTheme].bg"
      x-data="valentuneApp()">

    <!-- Cute Floating Emoji Background -->
                <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1] opacity-40">
                    <template x-for="i in 30" :key="i">
                        <div class="absolute w-16 h-16 md:w-24 md:h-24 lg:w-32 lg:h-32 animate-float-slow drop-shadow-2xl fill-current" 
                             :style="`left: ${Math.random() * 110 - 10}%; top: ${Math.random() * 110 - 10}%; animation-delay: ${i * 0.2}s; animation-duration: ${4 + Math.random() * 6}s; transform: scale(${0.4 + Math.random() * 0.8});`" 
                             x-html="themeStyles[activeTheme].icons[i % themeStyles[activeTheme].icons.length]"></div>
                    </template>
                </div>

    <!-- Main Wrapper -->
            <div class="p-2 md:p-4 lg:p-6 max-w-3xl mx-auto min-h-screen flex flex-col transition-colors duration-1000" :class="themeStyles[activeTheme].text">

                <!-- ============================== -->
                <!-- VIEW 1: CREATE PLAYLIST FORM   -->
                <!-- ============================== -->
                <div x-show="view === 'create'" x-cloak class="flex-1 py-4 md:py-6" x-transition.opacity.duration.1000ms>
            
                    <div class="text-center mb-6 md:mb-8">
                                <h1 class="text-5xl font-black tracking-tight mb-3 text-transparent bg-clip-text bg-gradient-to-r drop-shadow-sm" :class="themeStyles[activeTheme].gradientText">Valentune</h1>
                                <p class="opacity-80 text-sm font-medium flex items-center justify-center gap-1.5">Curate a beautiful musical gift, purely magical. <svg class="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg></p>
                            </div>
            
                <form @submit.prevent="generateLink" class="space-y-4 md:space-y-6">
                
                                <!-- Theme Selector -->
                                                <div class="p-4 md:p-6 rounded-3xl transition-all duration-700" :class="themeStyles[activeTheme].neu">
                                        <h2 class="text-lg font-extrabold mb-3 opacity-90 flex items-center gap-2">
                                            <span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg></span> Pick a Vibe
                                        </h2>
                                        <div class="grid grid-cols-3 gap-3">
                                            <template x-for="(config, key) in themeStyles" :key="key">
                                                <button type="button" @click="form.theme = key"
                                                        class="p-3 rounded-xl transition-all duration-500 font-bold capitalize flex flex-col items-center gap-2 transform"
                                                        :class="form.theme === key ? themeStyles[key].neuPressed + ' scale-95 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105 ' + themeStyles[activeTheme].neu">
                                                    <span class="w-6 h-6 fill-current flex items-center justify-center" x-html="config.icons[0]"></span>
                                                    <span x-text="key" class="text-xs"></span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>

                                <!-- Details -->
                                                                                                <div class="p-4 md:p-6 rounded-3xl space-y-3 md:space-y-4 transition-all duration-700" :class="themeStyles[activeTheme].neu">
                                                                                                    <h2 class="text-lg font-extrabold opacity-90 flex items-center gap-2">
                                                                                                        <span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></span> The Details
                                                                                                    </h2>
                    
                                                                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                                                                                        <div>
                                                                                            <label class="block font-bold mb-1 text-[10px] md:text-xs opacity-80 pl-2 uppercase tracking-wider">To (Recipient)</label>
                                                                                            <input x-model="form.to" type="text" required class="w-full p-2.5 md:p-3 rounded-xl outline-none transition-all duration-500 bg-transparent border-none placeholder-opacity-50 text-sm" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Their Name">
                                                                                        </div>
                                                                                        <div>
                                                                                            <label class="block font-bold mb-1 text-[10px] md:text-xs opacity-80 pl-2 uppercase tracking-wider">From (Sender)</label>
                                                                                            <input x-model="form.from" type="text" class="w-full p-2.5 md:p-3 rounded-xl outline-none transition-all duration-500 bg-transparent border-none placeholder-opacity-50 text-sm" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Someone who loves you">
                                                                                        </div>
                                                                                    </div>
                    
                                                                                    <div>
                                                                                        <label class="block font-bold mb-1 text-[10px] md:text-xs opacity-80 pl-2 uppercase tracking-wider">Sweet Message</label>
                                                                                        <textarea x-model="form.msg" required maxlength="500" class="w-full p-2.5 md:p-3 rounded-xl outline-none transition-all duration-500 h-20 md:h-24 resize-none bg-transparent border-none placeholder-opacity-50 text-sm" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Write something adorable..."></textarea>
                                                                                    </div>
                                                                                </div>

                                                <!-- Songs -->
                                                                                                                <div class="p-4 md:p-6 rounded-3xl transition-all duration-700" :class="themeStyles[activeTheme].neu">
                                                                                    <h2 class="text-lg font-extrabold mb-4 opacity-90 flex items-center gap-2">
                                                                                        <span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></span> The Playlist
                                                                                    </h2>
                    
                                                                                    <div class="space-y-4" x-ref="songList">
                                                                                                                            <template x-for="(song, index) in form.songs" :key="index">
                                                                                                                                <div class="p-3 md:p-4 rounded-2xl relative transition-all duration-500 group flex flex-col md:flex-row gap-3 md:gap-4" :class="themeStyles[activeTheme].neuPressed + (song.searchResults && song.searchResults.length > 0 ? ' z-50' : ' z-10')">
                                
                                                                                                                                                                                <!-- Auto Thumbnail Preview -->
                                                                                                                                                                                <div class="w-full md:w-32 h-24 flex-shrink-0 rounded-xl overflow-hidden flex items-center justify-center relative shadow-inner" :class="themeStyles[activeTheme].neu">
                                                                                                    <template x-if="getYouTubeID(song.url)">
                                                                                                        <img :src="`https://img.youtube.com/vi/${getYouTubeID(song.url)}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0 mix-blend-overlay opacity-90">
                                                                                                    </template>
                                                                                                    <template x-if="!getYouTubeID(song.url)">
                                                                                                        <span class="w-6 h-6 opacity-50"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg></span>
                                                                                                    </template>
                                                                                                </div>

                                                                                                <div class="flex-1 space-y-3 flex flex-col justify-center">
                                                                                                                                                    <div class="relative" @click.away="song.searchResults = []">
                                                                                                                                                        <div class="flex items-center gap-2 border-b-2 border-transparent focus-within:border-current transition-all pb-1">
                                                                                                                                                                                                                                                                    <span class="opacity-50 ml-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></span>
                                                                                                                                                                                                                                                                    <input x-model="song.searchQuery" @input.debounce.500ms="searchYouTube(song)" placeholder="Search YouTube to add a song..." class="w-full p-1.5 bg-transparent outline-none text-xs font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                <div x-show="song.searchResults && song.searchResults.length > 0" class="absolute z-50 w-full mt-2 rounded-xl overflow-hidden shadow-2xl bg-[#181818]/95 backdrop-blur-xl border border-white/5 p-1" x-transition>
                                                                                                                                                                                                                                                                    <template x-for="result in song.searchResults" :key="result.id.videoId">
                                                                                                                                                                                                                                                                        <div @click="selectVideo(song, result)" class="p-2 flex items-center gap-3 hover:bg-white/10 cursor-pointer transition-colors rounded-lg">
                                                                                                                                                                                                                                                                            <img :src="result.snippet.thumbnails.default.url" class="w-10 h-10 object-cover rounded shadow-md">
                                                                                                                                                                                                                                                                            <div class="flex-1 overflow-hidden flex flex-col justify-center">
                                                                                                                                                                                                                                                                                <p class="text-sm font-semibold truncate text-white leading-tight" x-text="result.snippet.title"></p>
                                                                                                                                                                                                                                                                                <p class="text-[10px] font-medium opacity-70 truncate text-gray-400 mt-0.5" x-text="result.snippet.channelTitle"></p>
                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                    </template>
                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 mt-2">
                                                                                                                                                                                                                                                                <input x-model="song.url" placeholder="YouTube Link or Video ID" required class="w-full p-2 rounded-lg bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-xs font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                                                                                                                                                                                                                                                <input x-model="song.title" placeholder="Song Title" required class="w-full p-2 rounded-lg bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-xs font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                                                                                                                                                                                                                                                <input x-model="song.note" placeholder="Special Note (Optional)" class="w-full p-2 rounded-lg bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-xs font-medium opacity-80 focus:opacity-100 md:col-span-2" :class="themeStyles[activeTheme].text">
                                                                                                                                                                                                                                                            </div>
                                                                                                                                                </div>
                                
                                                                                                <button type="button" @click="form.songs.splice(index, 1)" x-show="form.songs.length > 1" class="absolute -top-3 -right-3 w-8 h-8 rounded-full flex items-center justify-center text-red-500 opacity-0 group-hover:opacity-100 transition-all duration-300 transform hover:scale-110 z-10" :class="themeStyles[activeTheme].neu">
                                                                                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                                                                                                </button>
                                                                                            </div>
                                                                                        </template>
                                                                                    </div>
                    
                                                                                    <button type="button" @click="form.songs.push({url: '', title: '', note: '', searchQuery: '', searchResults: []})" class="mt-5 w-full p-3 rounded-xl font-bold text-xs transition-all duration-300 flex items-center justify-center gap-2 transform hover:-translate-y-1" :class="themeStyles[activeTheme].neu">
                                                                                        <span class="w-4 h-4"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg></span> Add Another Song
                                                                                    </button>
                                                                                </div>

                                                                                <button type="submit" class="w-full p-4 rounded-2xl font-extrabold text-lg transition-all duration-300 flex items-center justify-center gap-2 transform hover:-translate-y-1 active:scale-95" :class="themeStyles[activeTheme].btn">
                                                                                    <span class="w-5 h-5 animate-bounce inline-block text-yellow-400"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg></span> Generate Magic Link
                                                                                </button>
            </form>

            <!-- Share Link Output -->
                                    <div x-show="shareUrl" class="mt-8 p-5 md:p-6 rounded-3xl relative overflow-hidden transition-all duration-1000" :class="themeStyles[activeTheme].neu" style="display: none;" x-transition.opacity.duration.800ms>
                                        <h2 class="text-xl font-extrabold mb-2 flex items-center gap-2">
                                            <span class="w-5 h-5 text-yellow-400"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg></span> <span class="text-transparent bg-clip-text bg-gradient-to-r" :class="themeStyles[activeTheme].gradientText">Your mix is ready!</span>
                                        </h2>
                                        <p class="text-xs mb-4 font-medium opacity-80 flex items-center gap-1">Send this magic link to them. The URL holds all the secrets, so don't lose it! <svg class="w-3 h-3 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></p>
                
                                        <div class="relative group">
                                            <textarea x-model="shareUrl" readonly class="w-full p-4 rounded-xl text-[10px] font-mono h-24 outline-none resize-none pr-12 bg-transparent border-none opacity-80 transition-all duration-500" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text"></textarea>
                                            <button @click="copyToClipboard" class="absolute bottom-3 right-3 p-2 rounded-lg transition-all duration-300 transform hover:scale-110 active:scale-95 flex items-center justify-center" :class="themeStyles[activeTheme].neu" title="Copy">
                                                <template x-if="!copied"><span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg></span></template>
                                                <template x-if="copied"><span class="w-5 h-5 text-green-400"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></span></template>
                                            </button>
                                        </div>
                                    </div>
        </div>

        <!-- ============================== -->
        <!-- VIEW 2: RECIPIENT EXPERIENCE   -->
        <!-- ============================== -->
        <div x-show="view === 'recipient'" x-cloak class="flex-1 py-10 flex flex-col items-center justify-center min-h-screen">
            
            <!-- Animated Reveal -->
                                    <div x-show="!revealed" class="flex flex-col items-center justify-center text-center w-full" x-transition.opacity.duration.1500ms>
                                        <div class="mb-8 relative">
                                            <div class="w-24 h-24 mx-auto animate-bounce drop-shadow-2xl fill-current" style="animation-duration: 2s;" x-html="themeStyles[activeTheme].icons[1]"></div>
                                        </div>
                                        <h1 class="text-2xl font-medium mb-8 text-center opacity-80">A mix for <br><span class="text-5xl font-black mt-3 block text-transparent bg-clip-text bg-gradient-to-r drop-shadow-sm transition-all duration-1000" :class="themeStyles[activeTheme].gradientText" x-text="playlistData.to"></span></h1>
                
                                        <button @click="revealed = true" class="px-8 py-4 rounded-full font-extrabold text-xl transition-all duration-500 transform hover:scale-110 active:scale-95 flex items-center gap-2" :class="themeStyles[activeTheme].neu">
                                            Open Gift <span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5.5A2.5 2.5 0 109.5 8H12zm-7 4h14M5 12a2 2 0 110-4h14a2 2 0 110 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"></path></svg></span>
                                        </button>
                                    </div>

            <!-- Playlist Content -->
                                    <div x-show="revealed" class="w-full max-w-4xl mx-auto" style="display: none;" x-transition.opacity.duration.1500ms>
                
                                        <!-- Header -->
                                                        <div class="p-5 md:p-6 rounded-2xl mb-6 md:mb-8 text-center relative transition-all duration-1000 max-w-2xl mx-auto" :class="themeStyles[activeTheme].neu">
                                                            <h2 class="text-sm md:text-base font-bold mb-3 md:mb-4 opacity-70 uppercase tracking-widest flex items-center justify-center gap-2">
                                                                <span class="w-4 h-4"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg></span> From <span class="opacity-100 font-extrabold" x-text="playlistData.from"></span>
                                                            </h2>
                                                            <div class="relative inline-block px-3 md:px-4">
                                                                <p class="text-lg md:text-xl font-medium italic leading-relaxed" x-text="playlistData.msg"></p>
                                                            </div>
                                                        </div>

                                                        <!-- Tracks -->
                                                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 md:gap-6">
                                                            <template x-for="(song, index) in playlistData.songs" :key="index">
                                                                <div class="rounded-2xl overflow-hidden group transition-all duration-700 transform hover:-translate-y-2 flex flex-col h-full" :class="themeStyles[activeTheme].neu">
                                                                    <!-- Video Player with Auto Thumbnail Overlay -->
                                                                    <div class="aspect-video bg-black/10 relative" :class="themeStyles[activeTheme].neuPressed">
                                                                        <div x-data="{ playing: false }" class="absolute inset-0 z-10 rounded-t-2xl overflow-hidden" x-show="!playing">
                                                                            <img :src="`https://img.youtube.com/vi/${song.id}/maxresdefault.jpg`" onerror="this.src=`https://img.youtube.com/vi/${song.id}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0 opacity-80 group-hover:opacity-100 transition-opacity duration-700 mix-blend-overlay">
                                                                            <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-transparent transition-colors duration-500">
                                                                                <button @click="playing = true" class="w-12 h-12 md:w-16 md:h-16 rounded-full flex items-center justify-center hover:scale-110 transition-transform duration-300" :class="themeStyles[activeTheme].neu">
                                                                                    <span class="w-6 h-6 md:w-8 md:h-8 ml-1.5 md:ml-2"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                        <template x-if="true">
                                                                            <iframe width="100%" height="100%" 
                                                                                    class="absolute inset-0 z-0 rounded-t-2xl"
                                                                                    :src="'https://www.youtube.com/embed/' + song.id + '?autoplay=1'" 
                                                                                    frameborder="0" 
                                                                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                                                    allowfullscreen>
                                                                            </iframe>
                                                                        </template>
                                                                    </div>
                            
                                                                    <div class="p-4 flex-1 flex flex-col">
                                                                        <div class="flex items-center gap-3 mb-1">
                                                                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-black text-sm flex-shrink-0" :class="themeStyles[activeTheme].neuPressed" x-text="index + 1"></div>
                                                                            <h3 class="font-extrabold text-lg md:text-xl leading-tight" x-text="song.title"></h3>
                                                                        </div>
                                                                        <div x-show="song.note" class="mt-3 p-3 rounded-xl text-xs italic font-medium opacity-90 transition-all duration-500 flex-1" :class="themeStyles[activeTheme].neuPressed">
                                                                            <p class="flex gap-2"><span class="w-4 h-4 flex-shrink-0 mt-0.5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg></span> <span x-text="song.note" class="mt-0.5 leading-relaxed"></span></p>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                
                                            <div class="mt-12 mb-8 text-center">
                                                <a href="?" class="inline-flex items-center gap-2 px-6 py-3 rounded-full font-bold text-sm transition-all duration-500 hover:scale-110 active:scale-95" :class="themeStyles[activeTheme].neu">
                                                    <span class="w-5 h-5"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg></span> Create a Valentune
                                                </a>
                                            </div>
            </div>
        </div>
    </div>

    <script>
        function extractYouTubeID(url) {
            if(!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url; 
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('valentuneApp', () => ({
                view: 'create',
                revealed: false,
                shareUrl: '',
                copied: false,
                
                // Cute Glassmorphic Theme Engine
                                activeTheme: 'romance',
                                                                themeStyles: {
                                                                                                                                    romance: {
                                                                                                                                                                                                            bg: 'bg-[#150508]',
                                                                                                                                                                                                            text: 'text-rose-100',
                                                                                                                                                                                                            neu: 'glass-romance',
                                                                                                                                                                                                            neuPressed: 'glass-romance-pressed',
                                                                                                                                                                                                            btn: 'glass-romance hover:opacity-100',
                                                                                                                                                                                                            gradientText: 'from-rose-300 to-pink-300',
                                                                                                                                                                                                            icons: [
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>'
                                                                                                                                                                                                            ]
                                                                                                                                                                                                        },
                                                                                                                                                                                                        midnight: {
                                                                                                                                                                                                            bg: 'bg-[#050914]',
                                                                                                                                                                                                            text: 'text-indigo-100',
                                                                                                                                                                                                            neu: 'glass-midnight',
                                                                                                                                                                                                            neuPressed: 'glass-midnight-pressed',
                                                                                                                                                                                                            btn: 'glass-midnight hover:opacity-100',
                                                                                                                                                                                                            gradientText: 'from-indigo-300 to-purple-300',
                                                                                                                                                                                                            icons: [
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>',
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>',
                                                                                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>'
                                                                                                                                                                                                            ]
                                                                                                                                                                                                        },
                                                                                                                                                                                                        sunshine: {
                                                                                                                                                                                                            bg: 'bg-[#140c01]',
                                                                                                                                                                                                            text: 'text-amber-100',
                                                                                                                                                                                                            neu: 'glass-sunshine',
                                                                                                                                                                                                            neuPressed: 'glass-sunshine-pressed',
                                                                                                                                                                                                            btn: 'glass-sunshine hover:opacity-100',
                                                                                                                                                                                                            gradientText: 'from-orange-300 to-yellow-300',
                                                                                                                                            icons: [
                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>',
                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>',
                                                                                                                                                '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>'
                                                                                                                                            ]
                                                                                                                                        }
                                                                                                                                    },

                                                                                                                    form: {
                                                                                        to: '', from: '', msg: '', theme: 'romance',
                                                                                        songs: [{url: '', title: '', note: '', searchQuery: '', searchResults: []}]
                                                                                    },
                
                playlistData: {}, 

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const encodedMix = urlParams.get('mix');
                    
                    if (encodedMix) {
                        try {
                            const jsonString = decodeURIComponent(atob(encodedMix));
                            this.playlistData = JSON.parse(jsonString);
                            this.activeTheme = this.themeStyles[this.playlistData.theme] ? this.playlistData.theme : 'romance';
                            this.view = 'recipient';
                        } catch (e) {
                            alert("This mix link seems to be broken or invalid.");
                            this.view = 'create';
                        }
                    }

                    this.$watch('form.theme', value => {
                        if(this.view === 'create') this.activeTheme = value;
                    });
                },

                getYouTubeID(url) {
                                    return extractYouTubeID(url);
                                },

                                async searchYouTube(song) {
                                    if (!song.searchQuery || song.searchQuery.length < 3) {
                                        song.searchResults = [];
                                        return;
                                    }
                                    try {
                                        const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=5&q=${encodeURIComponent(song.searchQuery)}&type=video&key=AIzaSyDIQlnboovATDYq2myY3MaG3wkFEwBZIFU`);
                                        const data = await res.json();
                                        song.searchResults = data.items || [];
                                    } catch (e) {
                                        console.error('YouTube Search Error:', e);
                                        song.searchResults = [];
                                    }
                                },

                                selectVideo(song, video) {
                                    song.url = `https://www.youtube.com/watch?v=${video.id.videoId}`;
                                    song.title = video.snippet.title.replace(/"/g, '"').replace(/'/g, "'").replace(/&/g, '&');
                                    song.searchQuery = '';
                                    song.searchResults = [];
                                },

                                generateLink() {
                    const cleanData = {
                        to: this.form.to,
                        from: this.form.from || 'Someone who loves you',
                        msg: this.form.msg,
                        theme: this.form.theme,
                        songs: this.form.songs.filter(s => s.url).map(s => ({
                            id: extractYouTubeID(s.url),
                            title: s.title,
                            note: s.note
                        }))
                    };

                    if(cleanData.songs.length === 0) {
                                            alert("Please add at least one valid song.");
                                            return;
                                        }

                    const jsonString = JSON.stringify(cleanData);
                    const encodedMix = btoa(encodeURIComponent(jsonString));
                    
                    const baseUrl = window.location.origin + window.location.pathname;
                    this.shareUrl = `${baseUrl}?mix=${encodedMix}`;
                    this.copied = false;
                    
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
                },

                copyToClipboard() {
                    navigator.clipboard.writeText(this.shareUrl).then(() => {
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    });
                }
            }))
        })
    </script>
</body>
