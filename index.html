<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
</head>
<body class="bg-red-50 min-h-screen text-gray-800 p-4 max-w-md mx-auto" x-data="valentuneApp()">

    <!-- ============================== -->
    <!-- VIEW 1: CREATE PLAYLIST FORM   -->
    <!-- ============================== -->
    <div x-show="view === 'create'" x-cloak>
        <h1 class="text-3xl font-bold text-red-600 mb-6 mt-4">Make a Mix</h1>
        
        <form @submit.prevent="generateLink" class="space-y-4">
            <div>
                <label class="block font-bold mb-1 text-sm">To (Recipient)</label>
                <input x-model="form.to" type="text" required class="w-full border p-2 rounded">
            </div>
            
            <div>
                <label class="block font-bold mb-1 text-sm">From (Sender)</label>
                <input x-model="form.from" type="text" placeholder="Someone who loves you" class="w-full border p-2 rounded">
            </div>
            
            <div>
                <label class="block font-bold mb-1 text-sm">Message</label>
                <textarea x-model="form.msg" required maxlength="500" class="w-full border p-2 rounded h-24"></textarea>
            </div>

            <div class="border-t border-gray-300 pt-4">
                <h2 class="text-xl font-bold mb-2">Songs</h2>
                <template x-for="(song, index) in form.songs" :key="index">
                    <div class="bg-white p-3 rounded shadow mb-3 relative">
                        <label class="text-xs font-bold text-gray-500">YouTube Link or Video ID</label>
                        <input x-model="song.url" placeholder="e.g., https://youtube.com/watch?v=..." required class="w-full border p-2 mb-2 rounded text-sm bg-gray-50">
                        
                        <label class="text-xs font-bold text-gray-500">Song Title</label>
                        <input x-model="song.title" placeholder="Title" required class="w-full border p-2 mb-2 rounded text-sm bg-gray-50">
                        
                        <label class="text-xs font-bold text-gray-500">Special Note (Optional)</label>
                        <input x-model="song.note" placeholder="Why this song?" class="w-full border p-2 rounded text-sm bg-gray-50">
                        
                        <button type="button" @click="form.songs.splice(index, 1)" x-show="form.songs.length > 1" class="text-red-500 text-sm mt-2 font-bold">Remove</button>
                    </div>
                </template>
                <button type="button" @click="form.songs.push({url: '', title: '', note: ''})" class="bg-gray-200 w-full p-2 rounded font-bold text-sm">+ Add Another Song</button>
            </div>

            <button type="submit" class="bg-red-600 text-white font-bold w-full p-3 rounded shadow-lg mt-6 hover:bg-red-700">Generate Share Link</button>
        </form>

        <!-- Share Link Output -->
        <div x-show="shareUrl" class="mt-8 bg-white p-6 rounded-lg shadow-xl border border-green-200" style="display: none;">
            <h2 class="text-xl font-bold text-green-600 mb-2">Your mix is ready!</h2>
            <p class="text-sm mb-2 text-gray-600">Copy this link and send it to them. (Because we don't use a database, this link contains all the data—don't lose it!)</p>
            <textarea x-model="shareUrl" readonly class="w-full bg-gray-100 p-2 rounded text-xs font-mono h-24 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-red-400"></textarea>
            <button @click="copyToClipboard" class="mt-3 bg-gray-800 text-white font-bold w-full p-2 rounded text-sm">
                <span x-text="copied ? 'Copied!' : 'Copy to Clipboard'"></span>
            </button>
        </div>
    </div>

    <!-- ============================== -->
    <!-- VIEW 2: RECIPIENT EXPERIENCE   -->
    <!-- ============================== -->
    <div x-show="view === 'recipient'" x-cloak class="pb-10 pt-4">
        
        <!-- Animated Reveal -->
        <div x-show="!revealed" class="flex flex-col items-center justify-center h-[80vh]">
            <h1 class="text-3xl font-bold mb-8 text-center">A mix for <br><span class="text-red-600 text-5xl" x-text="playlistData.to"></span></h1>
            <button @click="revealed = true" class="bg-red-600 text-white font-bold py-3 px-8 rounded-full shadow-lg animate-bounce text-lg">
                Open Gift
            </button>
        </div>

        <!-- Playlist Content -->
        <div x-show="revealed" style="display: none;">
            <div class="bg-white p-6 rounded-lg shadow mb-8 text-center border-t-4 border-red-500">
                <h2 class="text-xl font-bold mb-3 text-gray-500">From: <span class="text-gray-900" x-text="playlistData.from"></span></h2>
                <p class="text-gray-800 text-lg italic leading-relaxed">"<span x-text="playlistData.msg"></span>"</p>
            </div>

            <div class="space-y-8">
                <template x-for="(song, index) in playlistData.songs" :key="index">
                    <div class="bg-white rounded-lg shadow-md overflow-hidden border border-gray-100">
                        <div class="aspect-video bg-gray-900">
                            <iframe width="100%" height="100%" 
                                    :src="'https://www.youtube.com/embed/' + song.id" 
                                    frameborder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen>
                            </iframe>
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-xl text-gray-800" x-text="song.title"></h3>
                            <div x-show="song.note" class="mt-3 text-sm text-gray-700 bg-red-50 p-3 border-l-4 border-red-400 rounded-r-lg italic">
                                <span x-text="song.note"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            
            <div class="mt-12 text-center">
                <a href="?" class="text-sm font-bold text-red-500 underline">Create your own Valentune</a>
            </div>
        </div>
    </div>

    <!-- ============================== -->
    <!-- APPLICATION LOGIC (JAVASCRIPT) -->
    <!-- ============================== -->
    <script>
        // Helper to extract YouTube ID from full links (handles youtu.be, youtube.com/watch?v=, etc)
        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url; // Fallback to raw input if it's already an ID
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('valentuneApp', () => ({
                view: 'create', // 'create' or 'recipient'
                revealed: false,
                shareUrl: '',
                copied: false,
                
                // Default Form State
                form: {
                    to: '', from: '', msg: '',
                    songs: [
                        {url: '', title: '', note: ''},
                        {url: '', title: '', note: ''}
                    ]
                },
                
                playlistData: {}, // Holds decoded data for the recipient

                init() {
                    // Check if the URL has a '?mix=' parameter
                    const urlParams = new URLSearchParams(window.location.search);
                    const encodedMix = urlParams.get('mix');
                    
                    if (encodedMix) {
                        try {
                            // Decode the Base64 URL string back into JSON
                            const jsonString = decodeURIComponent(atob(encodedMix));
                            this.playlistData = JSON.parse(jsonString);
                            this.view = 'recipient';
                        } catch (e) {
                            alert("This mix link seems to be broken or invalid.");
                            this.view = 'create';
                        }
                    }
                },

                generateLink() {
                    // 1. Clean the data (extract just the YouTube IDs from whatever the user pasted)
                    const cleanData = {
                        to: this.form.to,
                        from: this.form.from || 'Someone who loves you',
                        msg: this.form.msg,
                        songs: this.form.songs.map(s => ({
                            id: extractYouTubeID(s.url),
                            title: s.title,
                            note: s.note
                        }))
                    };

                    // 2. Turn it into a string, make it URL-safe, and encode it to Base64
                    const jsonString = JSON.stringify(cleanData);
                    const encodedMix = btoa(encodeURIComponent(jsonString));

                    // 3. Build the final shareable URL using the current website address
                    const baseUrl = window.location.origin + window.location.pathname;
                    this.shareUrl = `${baseUrl}?mix=${encodedMix}`;
                    this.copied = false;
                },

                copyToClipboard() {
                    navigator.clipboard.writeText(this.shareUrl).then(() => {
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    });
                }
            }))
        })
    </script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</body>
</html>
