<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    </style>
</head>
<body class="min-h-screen transition-colors duration-500 ease-in-out antialiased" 
      :class="themeStyles[activeTheme].bg"
      x-data="valentuneApp()">

    <!-- Main Wrapper -->
    <div class="p-4 max-w-2xl mx-auto min-h-screen flex flex-col transition-colors duration-500" :class="themeStyles[activeTheme].text">

        <!-- ============================== -->
        <!-- VIEW 1: CREATE PLAYLIST FORM   -->
        <!-- ============================== -->
        <div x-show="view === 'create'" x-cloak class="flex-1 py-8">
            
            <div class="text-center mb-10">
                <h1 class="text-5xl font-extrabold tracking-tight mb-3" :class="themeStyles[activeTheme].accent">Valentune</h1>
                <p class="opacity-80 text-lg">Curate a beautiful musical gift, no database required.</p>
            </div>
            
            <form @submit.prevent="generateLink" class="space-y-8">
                
                <!-- Theme Selector -->
                <div class="glass p-6 rounded-2xl shadow-xl border" :class="themeStyles[activeTheme].cardBorder">
                    <h2 class="text-lg font-bold mb-4 opacity-90 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path></svg>
                        Select Theme
                    </h2>
                    <div class="grid grid-cols-3 gap-3">
                        <template x-for="(config, key) in themeStyles" :key="key">
                            <button type="button" @click="form.theme = key"
                                    class="p-3 rounded-xl border-2 transition-all duration-200 font-semibold capitalize flex flex-col items-center gap-2"
                                    :class="form.theme === key ? themeStyles[key].btn + ' border-transparent scale-105 shadow-md' : 'bg-transparent opacity-60 hover:opacity-100 ' + themeStyles[activeTheme].cardBorder">
                                <div class="w-6 h-6 rounded-full shadow-inner" :class="config.swatch"></div>
                                <span x-text="key"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Details -->
                <div class="glass p-6 rounded-2xl shadow-xl border space-y-5" :class="themeStyles[activeTheme].cardBorder">
                    <h2 class="text-lg font-bold opacity-90 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z"></path></svg>
                        The Details
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block font-bold mb-1 text-sm opacity-80">To (Recipient)</label>
                            <input x-model="form.to" type="text" required class="w-full p-3 rounded-xl bg-white/50 backdrop-blur-sm border border-black/10 focus:ring-2 outline-none transition-all" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText" placeholder="Their Name">
                        </div>
                        <div>
                            <label class="block font-bold mb-1 text-sm opacity-80">From (Sender)</label>
                            <input x-model="form.from" type="text" class="w-full p-3 rounded-xl bg-white/50 backdrop-blur-sm border border-black/10 focus:ring-2 outline-none transition-all" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText" placeholder="Someone who loves you">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block font-bold mb-1 text-sm opacity-80">Message</label>
                        <textarea x-model="form.msg" required maxlength="500" class="w-full p-3 rounded-xl bg-white/50 backdrop-blur-sm border border-black/10 focus:ring-2 outline-none transition-all h-28 resize-none" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText" placeholder="Write something sweet..."></textarea>
                    </div>
                </div>

                <!-- Songs -->
                <div class="glass p-6 rounded-2xl shadow-xl border" :class="themeStyles[activeTheme].cardBorder">
                    <h2 class="text-lg font-bold mb-4 opacity-90 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                        The Playlist
                    </h2>
                    
                    <div class="space-y-4" x-ref="songList">
                        <template x-for="(song, index) in form.songs" :key="index">
                            <div class="bg-black/5 p-4 rounded-xl border relative transition-all group hover:bg-black/10" :class="themeStyles[activeTheme].cardBorder">
                                
                                <div class="flex flex-col sm:flex-row gap-4">
                                    <!-- Auto Thumbnail Preview -->
                                    <div class="w-full sm:w-28 h-32 sm:h-28 flex-shrink-0 rounded-lg overflow-hidden bg-black/10 flex items-center justify-center relative shadow-inner">
                                        <template x-if="getYouTubeID(song.url)">
                                            <img :src="`https://img.youtube.com/vi/${getYouTubeID(song.url)}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0">
                                        </template>
                                        <template x-if="!getYouTubeID(song.url)">
                                            <svg class="w-8 h-8 opacity-30" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
                                        </template>
                                    </div>

                                    <div class="flex-1 space-y-3">
                                        <input x-model="song.url" placeholder="YouTube Link or Video ID" required class="w-full p-2.5 rounded-lg bg-white/60 border border-black/10 focus:ring-2 outline-none transition-all text-sm" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText">
                                        <input x-model="song.title" placeholder="Song Title" required class="w-full p-2.5 rounded-lg bg-white/60 border border-black/10 focus:ring-2 outline-none transition-all text-sm" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText">
                                        <input x-model="song.note" placeholder="Special Note (Optional)" class="w-full p-2.5 rounded-lg bg-white/60 border border-black/10 focus:ring-2 outline-none transition-all text-sm" :class="themeStyles[activeTheme].inputFocus + ' ' + themeStyles[activeTheme].inputText">
                                    </div>
                                </div>
                                
                                <button type="button" @click="form.songs.splice(index, 1)" x-show="form.songs.length > 1" class="absolute -top-3 -right-3 bg-red-500 hover:bg-red-600 text-white p-1.5 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </template>
                    </div>
                    
                    <button type="button" @click="form.songs.push({url: '', title: '', note: ''})" class="mt-4 w-full p-3 rounded-xl font-bold text-sm border-2 border-dashed opacity-70 hover:opacity-100 transition-all flex items-center justify-center gap-2" :class="themeStyles[activeTheme].cardBorder">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Add Another Song
                    </button>
                </div>

                <button type="submit" class="w-full p-4 rounded-xl shadow-xl font-bold text-lg transform hover:-translate-y-1 transition-all" :class="themeStyles[activeTheme].btn">
                    ✨ Generate Magic Link
                </button>
            </form>

            <!-- Share Link Output -->
            <div x-show="shareUrl" class="mt-10 glass p-8 rounded-2xl shadow-2xl border relative overflow-hidden" :class="themeStyles[activeTheme].cardBorder" style="display: none;" x-transition>
                <div class="absolute top-0 left-0 w-full h-2" :class="themeStyles[activeTheme].accentBg"></div>
                <h2 class="text-2xl font-extrabold mb-2" :class="themeStyles[activeTheme].accent">Your mix is ready!</h2>
                <p class="text-sm mb-4 opacity-80">Copy this link and send it to them. The magic is in the URL—don't lose it!</p>
                
                <div class="relative">
                    <textarea x-model="shareUrl" readonly class="w-full bg-black/10 p-4 rounded-xl text-xs font-mono h-32 border-0 focus:ring-2 outline-none resize-none pr-12" :class="themeStyles[activeTheme].inputFocus"></textarea>
                    <button @click="copyToClipboard" class="absolute bottom-3 right-3 p-2 rounded-lg backdrop-blur-md bg-white/20 hover:bg-white/40 transition-all" title="Copy">
                        <template x-if="!copied"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg></template>
                        <template x-if="copied"><svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg></template>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============================== -->
        <!-- VIEW 2: RECIPIENT EXPERIENCE   -->
        <!-- ============================== -->
        <div x-show="view === 'recipient'" x-cloak class="flex-1 py-10 flex flex-col items-center justify-center min-h-screen">
            
            <!-- Animated Reveal -->
            <div x-show="!revealed" class="flex flex-col items-center justify-center text-center w-full" x-transition.opacity.duration.1000ms>
                <div class="mb-8 relative">
                    <div class="absolute inset-0 blur-xl opacity-50 rounded-full" :class="themeStyles[activeTheme].accentBg"></div>
                    <svg class="w-24 h-24 relative z-10 animate-pulse" :class="themeStyles[activeTheme].accent" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </div>
                <h1 class="text-4xl font-light mb-8 text-center opacity-80">A mix for <br><span class="text-6xl font-extrabold mt-2 block opacity-100" :class="themeStyles[activeTheme].accent" x-text="playlistData.to"></span></h1>
                
                <button @click="revealed = true" class="px-10 py-4 rounded-full shadow-2xl font-bold text-xl transform hover:scale-105 transition-all animate-bounce" :class="themeStyles[activeTheme].btn">
                    Open Gift
                </button>
            </div>

            <!-- Playlist Content -->
            <div x-show="revealed" class="w-full max-w-xl mx-auto" style="display: none;" x-transition.opacity.duration.800ms>
                
                <!-- Header -->
                <div class="glass p-8 rounded-3xl shadow-2xl mb-10 text-center border-t-8 relative overflow-hidden" :class="themeStyles[activeTheme].cardBorder + ' border-t-' + themeStyles[activeTheme].rawColor">
                    <h2 class="text-lg font-bold mb-4 opacity-70 uppercase tracking-widest">From <span class="opacity-100" x-text="playlistData.from"></span></h2>
                    <div class="relative inline-block">
                        <span class="absolute -top-4 -left-6 text-4xl opacity-20" :class="themeStyles[activeTheme].accent">"</span>
                        <p class="text-2xl font-medium italic leading-relaxed px-4" x-text="playlistData.msg"></p>
                        <span class="absolute -bottom-6 -right-6 text-4xl opacity-20" :class="themeStyles[activeTheme].accent">"</span>
                    </div>
                </div>

                <!-- Tracks -->
                <div class="space-y-8">
                    <template x-for="(song, index) in playlistData.songs" :key="index">
                        <div class="glass rounded-2xl shadow-xl overflow-hidden border group" :class="themeStyles[activeTheme].cardBorder">
                            <!-- Video Player with Auto Thumbnail Overlay -->
                            <div class="aspect-video bg-black relative">
                                <div x-data="{ playing: false }" class="absolute inset-0 z-10" x-show="!playing">
                                    <img :src="`https://img.youtube.com/vi/${song.id}/maxresdefault.jpg`" onerror="this.src=`https://img.youtube.com/vi/${song.id}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0 opacity-80 group-hover:opacity-100 transition-opacity duration-500">
                                    <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                        <button @click="playing = true" class="w-16 h-16 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:scale-110 transition-transform shadow-2xl border border-white/30">
                                            <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        </button>
                                    </div>
                                </div>
                                <template x-if="true">
                                    <iframe width="100%" height="100%" 
                                            class="absolute inset-0 z-0"
                                            :src="'https://www.youtube.com/embed/' + song.id + '?autoplay=1'" 
                                            frameborder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowfullscreen>
                                    </iframe>
                                </template>
                            </div>
                            
                            <div class="p-6">
                                <div class="flex items-center gap-4 mb-2">
                                    <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm opacity-50 border-2 flex-shrink-0" :class="themeStyles[activeTheme].cardBorder" x-text="index + 1"></div>
                                    <h3 class="font-bold text-2xl" x-text="song.title"></h3>
                                </div>
                                <div x-show="song.note" class="mt-4 p-4 rounded-xl bg-black/5 border-l-4 italic" :class="'border-l-' + themeStyles[activeTheme].rawColor">
                                    <p class="opacity-90" x-text="song.note"></p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div class="mt-16 mb-8 text-center">
                    <a href="?" class="inline-flex items-center gap-2 px-6 py-3 rounded-full border-2 font-bold opacity-60 hover:opacity-100 transition-all hover:scale-105" :class="themeStyles[activeTheme].cardBorder">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        Create a Valentune
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function extractYouTubeID(url) {
            if(!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url; 
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('valentuneApp', () => ({
                view: 'create',
                revealed: false,
                shareUrl: '',
                copied: false,
                
                // Theming Engine
                activeTheme: 'romance',
                themeStyles: {
                    romance: {
                        bg: 'bg-gradient-to-br from-red-50 via-rose-100 to-pink-100',
                        text: 'text-rose-950',
                        cardBorder: 'border-rose-200/60',
                        btn: 'bg-rose-600 hover:bg-rose-700 text-white shadow-rose-500/30',
                        accent: 'text-rose-600',
                        accentBg: 'bg-rose-600',
                        rawColor: 'rose-500',
                        swatch: 'bg-rose-500',
                        inputFocus: 'focus:border-rose-400 focus:ring-rose-400/20',
                        inputText: 'text-rose-900 placeholder-rose-900/40'
                    },
                    midnight: {
                        bg: 'bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900',
                        text: 'text-indigo-50',
                        cardBorder: 'border-indigo-500/30 bg-slate-800/40',
                        btn: 'bg-indigo-500 hover:bg-indigo-400 text-white shadow-indigo-500/20',
                        accent: 'text-indigo-400',
                        accentBg: 'bg-indigo-500',
                        rawColor: 'indigo-500',
                        swatch: 'bg-indigo-500',
                        inputFocus: 'focus:border-indigo-400 focus:ring-indigo-400/20',
                        inputText: 'text-indigo-100 placeholder-indigo-100/40 bg-slate-800/60'
                    },
                    retro: {
                        bg: 'bg-gradient-to-br from-amber-100 via-orange-100 to-yellow-100',
                        text: 'text-amber-950',
                        cardBorder: 'border-amber-400/40',
                        btn: 'bg-orange-600 hover:bg-orange-700 text-white shadow-orange-600/30',
                        accent: 'text-orange-600',
                        accentBg: 'bg-orange-600',
                        rawColor: 'orange-500',
                        swatch: 'bg-orange-500',
                        inputFocus: 'focus:border-orange-400 focus:ring-orange-400/20',
                        inputText: 'text-amber-900 placeholder-amber-900/40'
                    }
                },

                form: {
                    to: '', from: '', msg: '', theme: 'romance',
                    songs: [{url: '', title: '', note: ''}]
                },
                
                playlistData: {}, 

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const encodedMix = urlParams.get('mix');
                    
                    if (encodedMix) {
                        try {
                            const jsonString = decodeURIComponent(atob(encodedMix));
                            this.playlistData = JSON.parse(jsonString);
                            this.activeTheme = this.themeStyles[this.playlistData.theme] ? this.playlistData.theme : 'romance';
                            this.view = 'recipient';
                        } catch (e) {
                            alert("This mix link seems to be broken or invalid.");
                            this.view = 'create';
                        }
                    }

                    this.$watch('form.theme', value => {
                        if(this.view === 'create') this.activeTheme = value;
                    });
                },

                getYouTubeID(url) {
                    return extractYouTubeID(url);
                },

                generateLink() {
                    const cleanData = {
                        to: this.form.to,
                        from: this.form.from || 'Someone who loves you',
                        msg: this.form.msg,
                        theme: this.form.theme,
                        songs: this.form.songs.filter(s => s.url).map(s => ({
                            id: extractYouTubeID(s.url),
                            title: s.title,
                            note: s.note
                        }))
                    };

                    if(cleanData.songs.length === 0) {
                        alert("Please add at least one valid song.");
                        return;
                    }

                    const jsonString = JSON.stringify(cleanData);
                    const encodedMix = btoa(encodeURIComponent(jsonString));
                    
                    const baseUrl = window.location.origin + window.location.pathname;
                    this.shareUrl = `${baseUrl}?mix=${encodedMix}`;
                    this.copied = false;
                    
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 100);
                },

                copyToClipboard() {
                    navigator.clipboard.writeText(this.shareUrl).then(() => {
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    });
                }
            }))
        })
    </script>
</body>
</html>
