<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
        
        /* Neumorphic Styles */
        .neu-romance { box-shadow: 6px 6px 16px #d9c2c4, -6px -6px 16px #ffffff; background: #ffe4e6; }
        .neu-romance-pressed { box-shadow: inset 6px 6px 12px #d9c2c4, inset -6px -6px 12px #ffffff; background: #ffe4e6; }
        
        .neu-midnight { box-shadow: 8px 8px 16px #221f57, -8px -8px 16px #403d9b; background: #312e81; }
        .neu-midnight-pressed { box-shadow: inset 8px 8px 16px #221f57, inset -8px -8px 16px #403d9b; background: #312e81; }
        
        .neu-sunshine { box-shadow: 6px 6px 16px #d8cfa9, -6px -6px 16px #ffffff; background: #fef3c7; }
        .neu-sunshine-pressed { box-shadow: inset 6px 6px 12px #d8cfa9, inset -6px -6px 12px #ffffff; background: #fef3c7; }

        /* Slow Float Animations */
        @keyframes float-slow {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(15deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        .animate-float-slow { animation: float-slow 8s ease-in-out infinite; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
    </style>
</head>
<body class="min-h-screen transition-all duration-1000 ease-in-out antialiased relative z-0" 
      :class="themeStyles[activeTheme].bg"
      x-data="valentuneApp()">

    <!-- Cute Floating Emoji Background -->
        <div class="fixed inset-0 pointer-events-none overflow-hidden z-[-1] opacity-30">
            <template x-for="i in 30" :key="i">
                <div class="absolute text-7xl md:text-[8rem] lg:text-[12rem] animate-float-slow drop-shadow-2xl" 
                     :style="`left: ${Math.random() * 110 - 10}%; top: ${Math.random() * 110 - 10}%; animation-delay: ${i * 0.4}s; animation-duration: ${6 + Math.random() * 8}s; transform: scale(${0.5 + Math.random()});`" 
                     x-text="themeStyles[activeTheme].emojis[i % themeStyles[activeTheme].emojis.length]"></div>
            </template>
        </div>

    <!-- Main Wrapper -->
    <div class="p-4 max-w-2xl mx-auto min-h-screen flex flex-col transition-colors duration-1000" :class="themeStyles[activeTheme].text">

        <!-- ============================== -->
        <!-- VIEW 1: CREATE PLAYLIST FORM   -->
        <!-- ============================== -->
        <div x-show="view === 'create'" x-cloak class="flex-1 py-8" x-transition.opacity.duration.1000ms>
            
            <div class="text-center mb-12">
                <h1 class="text-6xl font-black tracking-tight mb-4 text-transparent bg-clip-text bg-gradient-to-r drop-shadow-sm" :class="themeStyles[activeTheme].gradientText">Valentune</h1>
                <p class="opacity-80 text-lg font-medium">Curate a beautiful musical gift, purely magical. ✨</p>
            </div>
            
            <form @submit.prevent="generateLink" class="space-y-10">
                
                <!-- Theme Selector -->
                <div class="p-8 rounded-3xl transition-all duration-700" :class="themeStyles[activeTheme].neu">
                    <h2 class="text-xl font-extrabold mb-5 opacity-90 flex items-center gap-3">
                        <span class="text-2xl">🎨</span> Pick a Vibe
                    </h2>
                    <div class="grid grid-cols-3 gap-4">
                        <template x-for="(config, key) in themeStyles" :key="key">
                            <button type="button" @click="form.theme = key"
                                    class="p-4 rounded-2xl transition-all duration-500 font-bold capitalize flex flex-col items-center gap-3 transform"
                                    :class="form.theme === key ? themeStyles[key].neuPressed + ' scale-95 opacity-100' : 'opacity-60 hover:opacity-100 hover:scale-105 ' + themeStyles[activeTheme].neu">
                                <span class="text-3xl" x-text="config.emojis[0]"></span>
                                <span x-text="key" class="text-sm"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Details -->
                <div class="p-8 rounded-3xl space-y-6 transition-all duration-700" :class="themeStyles[activeTheme].neu">
                    <h2 class="text-xl font-extrabold opacity-90 flex items-center gap-3">
                        <span class="text-2xl">💌</span> The Details
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block font-bold mb-2 text-sm opacity-80 pl-2">To (Recipient)</label>
                            <input x-model="form.to" type="text" required class="w-full p-4 rounded-2xl outline-none transition-all duration-500 bg-transparent border-none placeholder-opacity-50" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Their Name">
                        </div>
                        <div>
                            <label class="block font-bold mb-2 text-sm opacity-80 pl-2">From (Sender)</label>
                            <input x-model="form.from" type="text" class="w-full p-4 rounded-2xl outline-none transition-all duration-500 bg-transparent border-none placeholder-opacity-50" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Someone who loves you">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block font-bold mb-2 text-sm opacity-80 pl-2">Sweet Message</label>
                        <textarea x-model="form.msg" required maxlength="500" class="w-full p-4 rounded-2xl outline-none transition-all duration-500 h-32 resize-none bg-transparent border-none placeholder-opacity-50" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text" placeholder="Write something adorable..."></textarea>
                    </div>
                </div>

                <!-- Songs -->
                <div class="p-8 rounded-3xl transition-all duration-700" :class="themeStyles[activeTheme].neu">
                    <h2 class="text-xl font-extrabold mb-6 opacity-90 flex items-center gap-3">
                        <span class="text-2xl">🎧</span> The Playlist
                    </h2>
                    
                    <div class="space-y-6" x-ref="songList">
                        <template x-for="(song, index) in form.songs" :key="index">
                            <div class="p-5 rounded-2xl relative transition-all duration-500 group flex flex-col sm:flex-row gap-5" :class="themeStyles[activeTheme].neuPressed">
                                
                                <!-- Auto Thumbnail Preview -->
                                <div class="w-full sm:w-32 h-36 sm:h-32 flex-shrink-0 rounded-xl overflow-hidden flex items-center justify-center relative shadow-inner" :class="themeStyles[activeTheme].neu">
                                    <template x-if="getYouTubeID(song.url)">
                                        <img :src="`https://img.youtube.com/vi/${getYouTubeID(song.url)}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0 mix-blend-overlay opacity-90">
                                    </template>
                                    <template x-if="!getYouTubeID(song.url)">
                                        <span class="text-4xl opacity-50">🎵</span>
                                    </template>
                                </div>

                                <div class="flex-1 space-y-4 flex flex-col justify-center">
                                    <input x-model="song.url" placeholder="YouTube Link or Video ID" required class="w-full p-3 rounded-xl bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-sm font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                    <input x-model="song.title" placeholder="Song Title" required class="w-full p-3 rounded-xl bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-sm font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                    <input x-model="song.note" placeholder="Special Note (Optional)" class="w-full p-3 rounded-xl bg-transparent border-b-2 border-transparent focus:border-current outline-none transition-all text-sm font-medium opacity-80 focus:opacity-100" :class="themeStyles[activeTheme].text">
                                </div>
                                
                                <button type="button" @click="form.songs.splice(index, 1)" x-show="form.songs.length > 1" class="absolute -top-3 -right-3 w-10 h-10 rounded-full flex items-center justify-center text-red-500 opacity-0 group-hover:opacity-100 transition-all duration-300 transform hover:scale-110 z-10" :class="themeStyles[activeTheme].neu">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </template>
                    </div>
                    
                    <button type="button" @click="form.songs.push({url: '', title: '', note: ''})" class="mt-8 w-full p-4 rounded-2xl font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2 transform hover:-translate-y-1" :class="themeStyles[activeTheme].neu">
                        <span class="text-xl">➕</span> Add Another Song
                    </button>
                </div>

                <button type="submit" class="w-full p-6 rounded-3xl font-extrabold text-xl transition-all duration-300 flex items-center justify-center gap-3 transform hover:-translate-y-2 active:scale-95" :class="themeStyles[activeTheme].btn">
                    <span class="animate-bounce inline-block">✨</span> Generate Magic Link
                </button>
            </form>

            <!-- Share Link Output -->
            <div x-show="shareUrl" class="mt-12 p-8 rounded-3xl relative overflow-hidden transition-all duration-1000" :class="themeStyles[activeTheme].neu" style="display: none;" x-transition.opacity.duration.800ms>
                <h2 class="text-2xl font-extrabold mb-3 flex items-center gap-2">
                    🎉 <span class="text-transparent bg-clip-text bg-gradient-to-r" :class="themeStyles[activeTheme].gradientText">Your mix is ready!</span>
                </h2>
                <p class="text-sm mb-6 font-medium opacity-80">Send this magic link to them. The URL holds all the secrets, so don't lose it! 💌</p>
                
                <div class="relative group">
                    <textarea x-model="shareUrl" readonly class="w-full p-5 rounded-2xl text-xs font-mono h-32 outline-none resize-none pr-16 bg-transparent border-none opacity-80 transition-all duration-500" :class="themeStyles[activeTheme].neuPressed + ' ' + themeStyles[activeTheme].text"></textarea>
                    <button @click="copyToClipboard" class="absolute bottom-4 right-4 p-3 rounded-xl transition-all duration-300 transform hover:scale-110 active:scale-95" :class="themeStyles[activeTheme].neu" title="Copy">
                        <template x-if="!copied"><span class="text-xl">📋</span></template>
                        <template x-if="copied"><span class="text-xl">✅</span></template>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============================== -->
        <!-- VIEW 2: RECIPIENT EXPERIENCE   -->
        <!-- ============================== -->
        <div x-show="view === 'recipient'" x-cloak class="flex-1 py-10 flex flex-col items-center justify-center min-h-screen">
            
            <!-- Animated Reveal -->
            <div x-show="!revealed" class="flex flex-col items-center justify-center text-center w-full" x-transition.opacity.duration.1500ms>
                <div class="mb-10 relative">
                    <div class="text-8xl animate-bounce drop-shadow-2xl" style="animation-duration: 2s;" x-text="themeStyles[activeTheme].emojis[1]"></div>
                </div>
                <h1 class="text-4xl font-medium mb-12 text-center opacity-80">A mix for <br><span class="text-7xl font-black mt-4 block text-transparent bg-clip-text bg-gradient-to-r drop-shadow-sm transition-all duration-1000" :class="themeStyles[activeTheme].gradientText" x-text="playlistData.to"></span></h1>
                
                <button @click="revealed = true" class="px-12 py-5 rounded-full font-extrabold text-2xl transition-all duration-500 transform hover:scale-110 active:scale-95 flex items-center gap-3" :class="themeStyles[activeTheme].neu">
                    Open Gift 🎁
                </button>
            </div>

            <!-- Playlist Content -->
            <div x-show="revealed" class="w-full max-w-xl mx-auto" style="display: none;" x-transition.opacity.duration.1500ms>
                
                <!-- Header -->
                <div class="p-10 rounded-3xl mb-12 text-center relative transition-all duration-1000" :class="themeStyles[activeTheme].neu">
                    <h2 class="text-lg font-bold mb-6 opacity-70 uppercase tracking-widest flex items-center justify-center gap-2">
                        <span>💌</span> From <span class="opacity-100 font-extrabold" x-text="playlistData.from"></span>
                    </h2>
                    <div class="relative inline-block px-6">
                        <p class="text-2xl font-medium italic leading-relaxed" x-text="playlistData.msg"></p>
                    </div>
                </div>

                <!-- Tracks -->
                <div class="space-y-10">
                    <template x-for="(song, index) in playlistData.songs" :key="index">
                        <div class="rounded-3xl overflow-hidden group transition-all duration-700 transform hover:-translate-y-2" :class="themeStyles[activeTheme].neu">
                            <!-- Video Player with Auto Thumbnail Overlay -->
                            <div class="aspect-video bg-black/10 relative" :class="themeStyles[activeTheme].neuPressed">
                                <div x-data="{ playing: false }" class="absolute inset-0 z-10 rounded-t-3xl overflow-hidden" x-show="!playing">
                                    <img :src="`https://img.youtube.com/vi/${song.id}/maxresdefault.jpg`" onerror="this.src=`https://img.youtube.com/vi/${song.id}/hqdefault.jpg`" class="w-full h-full object-cover absolute inset-0 opacity-80 group-hover:opacity-100 transition-opacity duration-700 mix-blend-overlay">
                                    <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-transparent transition-colors duration-500">
                                        <button @click="playing = true" class="w-20 h-20 rounded-full flex items-center justify-center hover:scale-110 transition-transform duration-300" :class="themeStyles[activeTheme].neu">
                                            <span class="text-4xl ml-1">▶️</span>
                                        </button>
                                    </div>
                                </div>
                                <template x-if="true">
                                    <iframe width="100%" height="100%" 
                                            class="absolute inset-0 z-0 rounded-t-3xl"
                                            :src="'https://www.youtube.com/embed/' + song.id + '?autoplay=1'" 
                                            frameborder="0" 
                                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                            allowfullscreen>
                                    </iframe>
                                </template>
                            </div>
                            
                            <div class="p-8">
                                <div class="flex items-center gap-5 mb-3">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center font-black text-lg flex-shrink-0" :class="themeStyles[activeTheme].neuPressed" x-text="index + 1"></div>
                                    <h3 class="font-extrabold text-2xl" x-text="song.title"></h3>
                                </div>
                                <div x-show="song.note" class="mt-6 p-5 rounded-2xl italic font-medium opacity-90 transition-all duration-500" :class="themeStyles[activeTheme].neuPressed">
                                    <p class="flex gap-3"><span class="text-xl">💭</span> <span x-text="song.note" class="mt-1"></span></p>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                
                <div class="mt-20 mb-12 text-center">
                    <a href="?" class="inline-flex items-center gap-3 px-8 py-4 rounded-full font-bold transition-all duration-500 hover:scale-110 active:scale-95" :class="themeStyles[activeTheme].neu">
                        <span>🪄</span> Create a Valentune
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function extractYouTubeID(url) {
            if(!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url; 
        }

        document.addEventListener('alpine:init', () => {
            Alpine.data('valentuneApp', () => ({
                view: 'create',
                revealed: false,
                shareUrl: '',
                copied: false,
                
                // Cute Neuromorphic Theme Engine
                activeTheme: 'romance',
                themeStyles: {
                    romance: {
                        bg: 'bg-[#ffe4e6]',
                        text: 'text-rose-900',
                        neu: 'neu-romance',
                        neuPressed: 'neu-romance-pressed',
                        btn: 'neu-romance hover:opacity-90',
                        gradientText: 'from-rose-500 to-pink-500',
                        emojis: ['🌸','💖','🎀','✨','🧸','🍓','💝']
                    },
                    midnight: {
                        bg: 'bg-[#312e81]',
                        text: 'text-indigo-100',
                        neu: 'neu-midnight',
                        neuPressed: 'neu-midnight-pressed',
                        btn: 'neu-midnight hover:opacity-90',
                        gradientText: 'from-indigo-300 to-purple-300',
                        emojis: ['🌙','✨','🦉','💤','🌌','💙','🌠']
                    },
                    sunshine: {
                        bg: 'bg-[#fef3c7]',
                        text: 'text-amber-900',
                        neu: 'neu-sunshine',
                        neuPressed: 'neu-sunshine-pressed',
                        btn: 'neu-sunshine hover:opacity-90',
                        gradientText: 'from-orange-500 to-yellow-500',
                        emojis: ['☀️','🌻','🐥','🍯','💛','🌼','🐝']
                    }
                },

                form: {
                    to: '', from: '', msg: '', theme: 'romance',
                    songs: [{url: '', title: '', note: ''}]
                },
                
                playlistData: {}, 

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const encodedMix = urlParams.get('mix');
                    
                    if (encodedMix) {
                        try {
                            const jsonString = decodeURIComponent(atob(encodedMix));
                            this.playlistData = JSON.parse(jsonString);
                            this.activeTheme = this.themeStyles[this.playlistData.theme] ? this.playlistData.theme : 'romance';
                            this.view = 'recipient';
                        } catch (e) {
                            alert("This mix link seems to be broken or invalid.");
                            this.view = 'create';
                        }
                    }

                    this.$watch('form.theme', value => {
                        if(this.view === 'create') this.activeTheme = value;
                    });
                },

                getYouTubeID(url) {
                    return extractYouTubeID(url);
                },

                generateLink() {
                    const cleanData = {
                        to: this.form.to,
                        from: this.form.from || 'Someone who loves you',
                        msg: this.form.msg,
                        theme: this.form.theme,
                        songs: this.form.songs.filter(s => s.url).map(s => ({
                            id: extractYouTubeID(s.url),
                            title: s.title,
                            note: s.note
                        }))
                    };

                    if(cleanData.songs.length === 0) {
                        alert("Please add at least one valid song. 🥺");
                        return;
                    }

                    const jsonString = JSON.stringify(cleanData);
                    const encodedMix = btoa(encodeURIComponent(jsonString));
                    
                    const baseUrl = window.location.origin + window.location.pathname;
                    this.shareUrl = `${baseUrl}?mix=${encodedMix}`;
                    this.copied = false;
                    
                    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 500);
                },

                copyToClipboard() {
                    navigator.clipboard.writeText(this.shareUrl).then(() => {
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    });
                }
            }))
        })
    </script>
</body>
</html>
